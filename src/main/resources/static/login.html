<!doctype html>
<html lang="es" data-bs-theme="dark">

<head>
    <title>Iniciar Sesión - Editor de Texto SaaS</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="bootstrap5.css">
    <!-- Bootstrap CSS v5.3.8 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
</head>

<body class="d-flex align-items-center py-4 bg-body-tertiary" style="min-height: 100vh;">

    <main class="form-signin w-100 m-auto" style="max-width: 400px;">
        <div class="card shadow-sm">
            <div class="card-body p-5 text-center">
                <!-- Logo extraído de tu navbar -->
                <img src="https://imgs.search.brave.com/C4yIC0ng_T4gk8mDh2jLP49bJsbezhziV6uVbBLS948/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9jZG4u/aWNvbnNjb3V0LmNv/bS9pY29uL3ByZW1p/dW0vcG5nLTI1Ni10/aHVtYi9lZGl0YXIt/dGV4dG8tNjQzOTk5/My01MzQ0MjA5LnBu/Zz9mPXdlYnAmdz0x/Mjg"
                    height="50" class="mb-4" alt="Logo">

                <h1 class="h3 mb-4 fw-normal fx-crt">Iniciar Sesión</h1>

                <form onsubmit="iniciarSesion(event)">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="usernameInput" placeholder="Usuario" required>
                        <label for="usernameInput">Usuario</label>
                    </div>
                    <div class="form-floating mb-4">
                        <input type="password" class="form-control" id="passwordInput" placeholder="Contraseña"
                            required>
                        <label for="passwordInput">Contraseña</label>
                    </div>

                    <button class="btn btn-primary w-100 py-2" type="submit">Entrar</button>
                </form>
            </div>
        </div>
    </main>

    <!-- Script para procesar el login -->
    <script>
        function iniciarSesion(event) {
            event.preventDefault(); // Evita que la página se recargue
            const username = document.getElementById('usernameInput').value;

            if (username) {
                // Se guarda el usuario en el localStorage (tal cual lo espera tu index.html)
                localStorage.setItem('username', username);
                // Redirige al editor principal
                window.location.href = './index.html';
            }
        }
    </script>
</body>

</html>
