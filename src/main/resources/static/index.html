    <main>
        <div class="container">
            <div class="fx-crt">Editor de Texto SaaS</div>
            <div class="mb-3">
                <label for="titulo" class="form-label">Título del Documento</label>
                <input id="titulo" class="form-control" placeholder="Título...">
            </div>
            <div class="mb-3">
                <label for="contenido" class="form-label">Contenido del documento</label>
                <textarea class="form-control" id="contenido" rows="18" placeholder="Contenido..."></textarea>
            </div>
            <br>
            <div class="mb-4">
                <button onclick="guardarDocumento()" class="btn btn-light">Guardar</button>
            </div>
            <div class="container">
                <div class="fx-crt">Documentos Guardados</div>
                <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4" id="lista"></div>
            </div>
    </main>
    <footer>
        <!-- place footer here -->
    </footer>
    <!-- Bootstrap JavaScript Bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script>
        const API = '/api/documentos';
        let idActual = null;

        function configurarSesion() {
            const username = localStorage.getItem('username') || sessionStorage.getItem('username');
            const authButton = document.getElementById('authButton');

            // Si el usuario no está validado, redirigir inmediatamente al login
            if (!username) {
                window.location.replace('./login.html');
                return;
            }

            // Si está validado, configurar el botón para cerrar sesión
            authButton.innerHTML = '<div class="fx-jitter">Cerrar sesión</div>';
            authButton.onclick = () => {
                localStorage.removeItem('username');
                sessionStorage.removeItem('username');
                window.location.reload(); // Al recargar sin usuario, redirigirá al login
            };
        }

        function generarResumen(texto, max = 50) {
            if (!texto) return 'Sin contenido';
            return texto.length > max ? `${texto.substring(0, max)}...` : texto;
        }

        async function cargarLista() {
            try {
                const res = await fetch(API, { cache: 'no-store' });
                if (!res.ok) throw new Error('No se pudieron cargar los documentos');

                const documentos = await res.json();
                const lista = document.getElementById('lista');
                lista.innerHTML = '';

                if (documentos.length === 0) {
                    lista.innerHTML = '<p class="text-muted text-center w-100">No hay documentos guardados.</p>';
                    return;
                }

                documentos.forEach((doc) => {
                    const col = document.createElement('div');
                    col.className = 'col';
                    const card = document.createElement('div');
                    card.className = 'card h-100 shadow-sm';
                    const body = document.createElement('div');
                    body.className = 'card-body d-flex flex-column';

                    const titulo = document.createElement('div');
                    titulo.className = 'fx-blueprint';
                    titulo.textContent = doc.titulo;
                    const texto = document.createElement('p');
                    texto.className = 'card-text text-muted';
                    texto.textContent = generarResumen(doc.contenido);
                    const boton = document.createElement('button');
                    boton.type = 'button';
                    boton.className = 'btn btn-primary mt-auto';
                    boton.textContent = 'Editar';
                    boton.onclick = () => {
                        cargarDocumento(doc);
                        document.getElementById('titulo').scrollIntoView({ behavior: 'smooth' });
                    };

                    body.append(titulo, texto, boton);
                    card.appendChild(body);
                    col.appendChild(card);
                    lista.appendChild(col);
                });
            } catch (error) {
                alert(error.message);
            }
        }

        function cargarDocumento(doc) {
            idActual = doc.id;
            document.getElementById('titulo').value = doc.titulo;
            document.getElementById('contenido').value = doc.contenido || '';
        }

        async function guardarDocumento() {
            const titulo = document.getElementById('titulo').value.trim();
            const contenido = document.getElementById('contenido').value;
            if (!titulo) {
                alert('Escribe un título antes de guardar el documento.');
                document.getElementById('titulo').focus();
                return;
            }

            const metodo = idActual ? 'PUT' : 'POST';
            const url = idActual ? `${API}/${idActual}` : API;
            try {
                const res = await fetch(url, {
                    method: metodo,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ titulo, contenido, autor: 'Alumno' })
                });
                if (!res.ok) throw new Error('No se pudo guardar el documento');

                idActual = null;
                document.getElementById('titulo').value = '';
                document.getElementById('contenido').value = '';
                await cargarLista();
            } catch (error) {
                alert(error.message);
            }
        }

        configurarSesion();
        cargarLista();
    </script>
</body>

</html>
